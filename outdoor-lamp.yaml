interval:
  # Every 10 seconds blink the LED for 0.1 s: visual "still running"
  - interval: 10seconds
    then:
      - light.toggle: led_output
      - delay: 0.1s
      - light.toggle: led_output

  # Every minute re-evaluate the cycle
  - interval: 1min
    then:
      - script.execute: lamp_update


button:
  - platform: restart
    name: "_Restart"
    disabled_by_default: true
    entity_category: diagnostic

  - platform: factory_reset
    name: "_Restart Factory Default"
    disabled_by_default: true
    entity_category: diagnostic


sensor:
  - platform: uptime
    name: "_Uptime"
    disabled_by_default: true
    entity_category: diagnostic

  - platform: wifi_signal
    name: "_Wi-Fi Signal"
    update_interval: 60s
    disabled_by_default: true
    entity_category: diagnostic


text_sensor:
  # Calculated sun times of today
  - platform: template
    name: "Twilight Info"
    id: twilight_info
    icon: mdi:weather-sunset
    update_interval: never
    disabled_by_default: true
    web_server:
      sorting_weight: 210

  # Calculated lamp times of today
  - platform: template
    name: "Lamp Schedule"
    id: lamp_info
    icon: mdi:lightbulb-auto-outline
    update_interval: never
    web_server:
      sorting_weight: 130

  - platform: wifi_info
    ip_address:
      name: "_IP Address"
      disabled_by_default: true
    ssid:
      name: "_Wi-Fi SSID"
      disabled_by_default: true
    bssid:
      name: "_Wi-Fi BSSID"
      disabled_by_default: true

  - platform: version
    name: "_ESPHome Version"
    hide_timestamp: true
    disabled_by_default: true
    entity_category: diagnostic



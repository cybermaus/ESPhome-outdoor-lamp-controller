    web_server:
      sorting_weight: 230
    on_value:
      then:
        - script.execute: lamp_update
        - script.execute:
            id: group_send
            param: "SCHEDULE_OFF"


script:
  # Decide what the cycle wants, and switch the lamp only when that changed.
  # Called on cycle enable, setting changes, time sync, boot and every
  # minute (so changed time points and the moving sun times are picked up).
  - id: lamp_update
    mode: restart
    then:
      - lambda: |-

          // unknown until proven otherwise:
          id(lamp_target) = -1;   // unknown until proven otherwise

          // If we are in the midle of a multi-step config change:
          // like a UDP receive skip this lamp_update:
          if (id(cfg_hold)) {
            return;
          }

          // If any of TimeZone, Lat or Lon is empty, use HA Runtime settings:
          // for clock and sun calculation:
          if (!id(tz_text).state.empty()) {
            id(ha_time).set_timezone(id(tz_text).state);
          }
          if (!std::isnan(id(loc_lat).state)) {
            id(sun_sun).set_latitude(id(loc_lat).state);
          }
          if (!std::isnan(id(loc_lon).state)) {
            id(sun_sun).set_longitude(id(loc_lon).state);
          }

          // Twilight level; Normal, Half Civil, Civil:
          static const double elevations[] = {-0.833, -3.0, -6.0};
          size_t lvl = id(twilight).active_index().value_or(0);
          if (lvl > 2) {
            lvl = 0;
          }


          auto t = id(ha_time).now();
          ESP_LOGD("sun", "time=%s valid=%d TZ='%s' lat=%.1f lon=%.1f", t.strftime("%Y-%m-%d %H:%M:%S %z").c_str(),
            t.is_valid(), id(tz_text).state.c_str(), id(loc_lat).state, id(loc_lon).state);

          bool sun = id(use_sun).state;
          bool scd = id(use_schedule).state;
          bool sns = id(sensor_act).state;   // SENSOR action
          bool mot = id(motion_act).state;   // MOTION action
          const double thr = elevations[lvl];
          char buf[48];

          // MOTION: on while the sun is below the level. Overrides the pause.
          // Works without a clock: a missing clock must not disable a safety light.
          if (mot && (!t.is_valid() || id(sun_sun).elevation() < thr)) {
            id(ms_driven) = true;
            id(lamp_target) = 1;
            snprintf(buf, sizeof(buf), "Motion detected");
            id(lamp_info).publish_state(buf);
            return;
          }

          // Neither sun nor schedule: only SENSOR, MOTION or the manual switch.
          // Needs no clock.
          if (!sun && !scd) {
            if (sns) {
              id(ms_driven) = true;
              id(lamp_target) = 1;
              snprintf(buf, sizeof(buf), "Daylight sensor active");
            } else if (id(ms_driven)) {
              id(ms_driven) = false;     // released: back to off
              id(lamp_target) = 0;
              snprintf(buf, sizeof(buf), "Manual switch only");
            } else {
              id(lamp_applied) = -1;     // forget, next one is a first state
              snprintf(buf, sizeof(buf), "Manual switch only");
            }
            id(lamp_info).publish_state(buf);
            return;
          }
          id(ms_driven) = false;

          // No valid clock; the cycle does nothing. Forget the applied state, so the:
          // next one counts as a first state and is not broadcast:
          if (!t.is_valid()) {
            id(lamp_applied) = -1;
            snprintf(buf, sizeof(buf), "No valid clock, manual only");
            id(lamp_info).publish_state(buf);
            return;
          }

          // Sun and/or Schedule active and a valid time: process the cycle
          int m   = t.hour * 60 + t.minute;
          int on  = id(schedule_on).hour  * 60 + id(schedule_on).minute;
          int off = id(schedule_off).hour * 60 + id(schedule_off).minute;

          // Is minute inside start..end? End itself is outside :
          // End before start crosses midnight. start == end is empty :
          auto in_window = [](int minute, int start, int end) -> bool {
            if (end < start) return minute >= start || minute < end; // crosses midnight
            if (end > start) return minute >= start && minute < end; // normal window
            return false; // so end==start; empty window
          };

          if (sun) {
            // Decision by elevation: continuous, no date rollover jump.
            // Wall_switch: when use_sensor this will widen light on period
            bool dark  = id(sun_sun).elevation() < thr || sns;
            bool pause = in_window(m, off, on);   // off..on, sun + times
            bool in_night_pause = scd && pause;
            id(lamp_target) = (dark && !in_night_pause) ? 1 : 0;


            // Info text only, never feeds the decision:
            auto up = id(sun_sun).sunrise(thr);
            auto dn = id(sun_sun).sunset(thr);
            if (up.has_value() && dn.has_value()) {
              snprintf(buf, sizeof(buf), "Next sun up %02d:%02d down %02d:%02d",
                       up->hour, up->minute, dn->hour, dn->minute);
              id(twilight_info).publish_state(buf);
              if (scd) {
                snprintf(buf, sizeof(buf), "%02d:%02d-%02d:%02d and %02d:%02d-%02d:%02d",
                         id(schedule_on).hour, id(schedule_on).minute,
                         up->hour, up->minute, dn->hour, dn->minute,
                         id(schedule_off).hour, id(schedule_off).minute);
              } else {
                snprintf(buf, sizeof(buf), "%02d:%02d-%02d:%02d",
                         dn->hour, dn->minute, up->hour, up->minute);
              }
            } else {
              id(twilight_info).publish_state("No sunrise/sunset today");
              if (scd) {
                snprintf(buf, sizeof(buf), "Follows sun, off %02d:%02d-%02d:%02d",
                         id(schedule_off).hour, id(schedule_off).minute,
                         id(schedule_on).hour, id(schedule_on).minute);
              } else {
                snprintf(buf, sizeof(buf), "Follows sun level");
              }
            }
            id(lamp_info).publish_state(buf);

          } else {
            if (scd) {
              // no Sun & Schedule: on from schedule_on to schedule_off, any length
              // Schedule only: the entire night, any length
              // Wall_switch: when SENSOR this will widen light on period
              bool in_schedule = in_window(m, on, off);
              id(lamp_target) = (in_schedule || sns) ? 1 : 0;
              snprintf(buf, sizeof(buf), "%02d:%02d-%02d:%02d",
                       id(schedule_on).hour, id(schedule_on).minute,
                       id(schedule_off).hour, id(schedule_off).minute);
              id(lamp_info).publish_state(buf);
            }
          }

      - if:
          condition:
            lambda: 'return id(lamp_target) >= 0 && id(lamp_target) != id(lamp_applied);'
          then:
            # The first apply after boot / enable is not broadcast. If the
            # group has another state, its answer to REQCONFIG wins.
            - lambda: 'id(quiet_apply) = (id(lamp_applied) < 0);'
            - if:
                condition:
                  lambda: 'return id(lamp_target) == 1;'
                then:
                  - light.turn_on: lamp_output
                else:
                  - light.turn_off: lamp_output
            - lambda: |-
                id(quiet_apply) = false;
                id(lamp_applied) = id(lamp_target);

  # After a received USE_SUN / USE_SCHEDULE: let the rest of the series arrive,
  # then evaluate the cycle once, without broadcasting.
  - id: eval_quiet
    mode: restart
    then:
      - delay: 500ms
      - lambda: 'id(tx_mute) = true;'
      - script.execute: lamp_update
      - lambda: 'id(tx_mute) = false;'

  # NTP server = DHCP gateway, assumed to run NTP. Server 2 stays the pool,
  # needs internet, harmless without. configTime restarts the SNTP client and
  # also resets the timezone, so that is put back at once.
  - id: net_setup
    mode: restart
    then:
      - lambda: |-
          IPAddress gw = WiFi.gatewayIP();
          if (gw != IPAddress(0, 0, 0, 0)) {
            static char ntp_buf[16];      // must stay valid, SNTP keeps the pointer
            snprintf(ntp_buf, sizeof(ntp_buf), "%u.%u.%u.%u", gw[0], gw[1], gw[2], gw[3]);
            configTime(0, 0, ntp_buf, "0.pool.ntp.org");
            if (!id(tz_text).state.empty()) {
              id(ha_time).set_timezone(id(tz_text).state);
            }
          }

  # Send one parameter to the group. The value is made here from the
  # parameter name, which is the uppercase ID.
  - id: group_send
    parameters:
      param: string
    then:
      - if:
          condition:
            lambda: 'return id(group_live) && !id(tx_mute) && !id(quiet_apply) && !id(device_group).state.empty();'
          then:
            - lambda: |-
                std::string v;
                char b[24];
                if (param == "LAMP") {
                  // v = id(lamp_output).current_values.is_on() ? "1" : "0";
                  v = id(lamp_output).remote_values.is_on() ? "1" : "0";
                } else if (param == "USE_SCHEDULE") {
                  v = id(use_schedule).state ? "1" : "0";
                } else if (param == "USE_SUN") {
                  v = id(use_sun).state ? "1" : "0";
                } else if (param == "TWILIGHT") {
                  v = std::string(id(twilight).current_option());
                } else if (param == "LOC_LAT") {
                  snprintf(b, sizeof(b), "%.3f", id(loc_lat).state);
                  v = b;
                } else if (param == "LOC_LON") {
                  snprintf(b, sizeof(b), "%.3f", id(loc_lon).state);
                  v = b;
                } else if (param == "TZ_TEXT") {
                  v = id(tz_text).state;
                } else if (param == "SCHEDULE_ON") {
                  snprintf(b, sizeof(b), "%02d:%02d:%02d",
                           id(schedule_on).hour, id(schedule_on).minute, id(schedule_on).second);
                  v = b;
                } else if (param == "SCHEDULE_OFF") {
                  snprintf(b, sizeof(b), "%02d:%02d:%02d",
                           id(schedule_off).hour, id(schedule_off).minute, id(schedule_off).second);
                  v = b;
                } else if (param == "MOTION") {
                  v = id(motion_act).state ? "1" : "0";
                } else if (param == "SENSOR") {
                  v = id(sensor_act).state ? "1" : "0";
                }


                std::string pre = "LAMPGROUP:" + id(device_group).state + ":" + param + ":";
                // Only the latest value of a parameter matters: replace a queued one
                for (auto &q : id(udp_queue)) {
                  if (q.compare(0, pre.size(), pre) == 0) {
                    q = pre + v;
                    return;
                  }
                }
                if (id(udp_queue).size() < 24) {
                  id(udp_queue).push_back(pre + v);
                }
            - if:
                condition:
                  not:
                    script.is_running: group_flush
                then:
                  - script.execute: group_flush


  # Ask the group for its config. Immediate on user change or with never valid config.
  # With staggered long delay on reboots with prior valid config to avoid network storm
  # after a full power outage. This also  allows the network to come up first
  - id: group_request
    mode: restart
    then:
      - lambda: |-
          id(group_live) = true;
          id(rx_mask) = 0;
      - delay: !lambda |-
          if (id(req_fast)) {
            // User did a group change: network is up, ask immediate, as a REQCONFIG
            id(req_fast) = false;
            id(req_is_request) = true;
            return (uint32_t) 0;    // No wait
          }
          if (!id(group_synced).state || id(sync_is_suspect)) {
            // Never synced (new device or new group): ask soon, as a REQCONFIG
            // or a former or real lone device : ask soon, as a REQCONFIG
            id(req_after_cycle) = false;
            id(req_is_request) = true;
            return (uint32_t) 5000; // Allow DHCP time to finish
          }
          id(req_is_request) = false;
          if (id(req_after_cycle)) {
            // WiFi reconnect cycle: ask soon, as a RECONNECT
            id(req_after_cycle) = false;
            return (uint32_t) 5000; // Allow DHCP time to finish
          } 
          // Boot / reconnect: background stagger in 20 to 30 min
          return (uint32_t) (1200000 + random_uint32() % 600000);
      - lambda: |-
          id(req_sent) = true;
          id(last_req_ms) = millis();
      - if:
          condition:
            lambda: 'return !id(device_group).state.empty();'
          then:
            - logger.log:
                format: "out: LAMPGROUP:%s:%s"
                args: ['id(device_group).state.c_str()', 'id(req_is_request) ? "REQCONFIG" : "RECONNECT"']
                level: DEBUG
                tag: udp
            - udp.write:
                id: lamp_udp
                data: !lambda |-
                  std::string s = "LAMPGROUP:" + id(device_group).state + (id(req_is_request) ? ":REQCONFIG" : ":RECONNECT");
                  return std::vector<uint8_t>(s.begin(), s.end());
            - delay: 50ms
            - udp.write:
                id: lamp_udp
                data: !lambda |-
                  std::string s = "LAMPGROUP:" + id(device_group).state + (id(req_is_request) ? ":REQCONFIG" : ":RECONNECT");
                  return std::vector<uint8_t>(s.begin(), s.end());
      - delay: 10s
      # Nothing from our group arrived: we are alone, so we assume we are synced.
      - if:
          condition:
            lambda: 'return !id(group_peers).state;'
          then:
            - lambda: 'id(sync_is_suspect) = true;'
            - switch.turn_on: group_synced
      # No full set yet: so we keep asking in a while loop
      # note the while is infinite, but the UDP receive simply cancels this script to end
      - while:
          condition:
            lambda: 'return !id(device_group).state.empty();'
          then:
            - delay: 5min
            # grab timestamp to ignore echo's
            - lambda: |-
                id(req_is_request) = true;
                id(req_sent) = true;
                id(last_req_ms) = millis();
            - logger.log:
                format: "out: LAMPGROUP:%s:REQCONFIG (retry)"
                args: ['id(device_group).state.c_str()']
                level: DEBUG
                tag: udp
            - udp.write:
                id: lamp_udp
                data: !lambda |-
                  std::string s = "LAMPGROUP:" + id(device_group).state + ":REQCONFIG";
                  return std::vector<uint8_t>(s.begin(), s.end());
            - delay: 50ms
            - udp.write:
                id: lamp_udp
                data: !lambda |-
                  std::string s = "LAMPGROUP:" + id(device_group).state + ":REQCONFIG";
                  return std::vector<uint8_t>(s.begin(), s.end());


  # Answer a REQCONFIG: send everything, spread in time so the answers of
  # several lamps do not all arrive at once.
  - id: group_dump
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t) ((id(dump_slow) ? 60000 : 0) + random_uint32() % 500);'
      - script.execute:
          id: group_send
          param: "LAMP"
      - delay: 50ms
      - script.execute:
          id: group_send
          param: "TWILIGHT"
      - delay: 50ms
      - script.execute:
          id: group_send
          param: "LOC_LAT"
      - delay: 50ms
      - script.execute:
          id: group_send
          param: "LOC_LON"
      - delay: 50ms
      - script.execute:
          id: group_send
          param: "TZ_TEXT"
      - delay: 50ms
      - script.execute:
          id: group_send
          param: "SCHEDULE_ON"
      - delay: 50ms
      - script.execute:
          id: group_send
          param: "SCHEDULE_OFF"
      - delay: 50ms
      - script.execute:
          id: group_send
          param: "USE_SUN"
      - delay: 50ms
      - script.execute:
          id: group_send
          param: "USE_SCHEDULE"

  # Send the queued packets one by one, 20 ms apart, so a burst of changes
  # does not exhaust the network buffers.
  - id: group_flush
    mode: single
    then:
      - while:
          condition:
            lambda: 'return !id(udp_queue).empty();'
          then:
            - logger.log:
                format: "out: %s"
                args: ['id(udp_queue).front().c_str()']
                level: DEBUG
                tag: udp
            - udp.write:
                id: lamp_udp
                data: !lambda |-
                  std::string s = id(udp_queue).front();
                  return std::vector<uint8_t>(s.begin(), s.end());
            # sending it twice to counter lossy UDP
            - delay: 50ms
            - udp.write:
                id: lamp_udp
                data: !lambda |-
                  std::string s = id(udp_queue).front();
                  return std::vector<uint8_t>(s.begin(), s.end());
            - lambda: 'id(udp_queue).erase(id(udp_queue).begin());'
            - delay: 20ms

  # When we get no time-sync for a prolonged time, we will cycle the WiFi
  # we prefer that over a full reboot, as a reboot would loose the clock completely.
  - id: wifi_cycle
    mode: single
    then:
      - wifi.disable:
      - delay: 10min
      - lambda: 'id(req_after_cycle) = true;'
      - wifi.enable:

  # Blanking out TZ will put back compile defaults for TZ and location
  # Not only for my own easy, but also it gives the user an example TZ
  - id: reset_location
    mode: restart
    then:
      - delay: 1s
      - lambda: |-
          id(loc_lat).make_call().set_value(${default_latitude}).perform();
          id(loc_lon).make_call().set_value(${default_longitude}).perform();
          id(tz_text).make_call().set_value("${default_timezone}").perform();

#  # Hostname from the label, applied after ESPHome's own apply at connect.
#  - id: hostname_apply
#    mode: restart
#    then:

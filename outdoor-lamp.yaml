interval:
  # Every 10 seconds blink the LED for 0.1 s: visual "still running"
  - interval: 10seconds
    then:
      - light.toggle: led_output
      - delay: 0.1s
      - light.toggle: led_output

  # Every minute re-evaluate the cycle
  - interval: 1min
    then:
      # Every minute: a received MOTION/SENSOR expires after 10 min without refresh
      - lambda: |-
          id(tx_mute) = true;
          if (id(motion_rx_ms) && millis() - id(motion_rx_ms) > 600000) {
            id(motion_rx_ms) = 0;
            id(motion_act).turn_off();
          }
          if (id(sensor_rx_ms) && millis() - id(sensor_rx_ms) > 600000) {
            id(sensor_rx_ms) = 0;
            id(sensor_act).turn_off();
          }
          id(tx_mute) = false;
      - script.execute: lamp_update


  # Every 5 min: the lamp that originated MOTION/SENSOR repeats it, plus LAMP
  - interval: 5min
    then:
      - if:
          condition:
            lambda: 'return (id(motion_act).state && id(motion_rx_ms) == 0) || (id(sensor_act).state && id(sensor_rx_ms) == 0);'
          then:
            - script.execute:
                id: group_send
                param: "LAMP"
            - if:
                #if MOTION originated here, then resend it every 5 minutes
                condition:
                  lambda: 'return id(motion_act).state && id(motion_rx_ms) == 0;'
                then:
                  - script.execute:
                      id: group_send
                      param: "MOTION"
            - if:
                #if SENSOR originated here, then resend it every 5 minutes
                condition:
                  lambda: 'return id(sensor_act).state && id(sensor_rx_ms) == 0;'
                then:
                  - script.execute:
                      id: group_send
                      param: "SENSOR"


  # Every hour: count hours without a time sync, and act on it.
  # We have valid clock, then cycle wifi, reboot after 7 days
  # we have no valid clock, but do need one, reboot after 6 hours
  - interval: 1h
    then:
      - lambda: |-

          // count the hours, the count is reset by time sync:
          id(unsynced_hours)++;
          int h = id(unsynced_hours);

          // Only act every 6 hours:
          if (h % 6 != 0 && h < 168) {
            return;
          }

          bool clock_valid = id(ha_time).now().is_valid();
          bool needs_clock = id(use_sun).state || id(use_schedule).state;

          // Last resort: 7 days without a sync, or already no clock
          if (h >= 168 || (!clock_valid && needs_clock)) {
            App.safe_reboot();
            return;
          }

          // Otherwise cycle the WiFi:
          if (!id(wifi_cycle).is_running()) {
            id(wifi_cycle).execute();
          }



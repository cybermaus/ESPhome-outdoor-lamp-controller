# Outdoor lamp controller
#
# NARRATIVE
#
# One device with a relay to switch a lamp, a wall switch input, and a daily cycle based on sunrise/sunset.
# They are as independent from centralized control as possible, only need time but otherwise
# can run and switch independantly and without connectivity.
#
# Yes, despite this independence, when they do have connectivity, they talk and 
# configure as one, switch as one, report into HA. They behave as if they are centralized
# but when all connections drop, they continue to work
#
# Control wise, the device has 4 inputs driving the lamp:
#   USE_SUN      : lamp driven by sun up and sun down
#   USE_SCHEDULE : lamp driven by a single pair of on/off times
#   SENSOR       : an external daylight sensor says it is dark
#   MOTION       : an external motion sensor says someone is there
# plus the wall switch, which is either a hotel/hallway switch (toggles the
# lamp on every edge) or a hardware input for SENSOR or MOTION, see INPUTS.
#
# When combined, these interact
#   SUN+SCHEDULE : On at sundown, off at schedule, on at schedule, off at sunup
#                  For example, on from 05h30-sunup and from sundown-23h00
#   SUN+SENSOR   : On at sun times, except when it suddenly gets dark extra early
#                  due to overcast. We call this "widen the dark" in comment lines  
#   SENSOR+SCHED : On at sensor dark, but we go off for the dead of night
#                  For example, on from dark-23h00 and from 05h30-light
#   Similar intuitive use cases exist for the other permutations.
#   MOTION is not part of these combinations, when motion detected and dark, then
#          switch on, even in the dead of night with a programmed off period.
#
# The schedule is a simple day schedule. No weekend vs weekday, no extra late on saturday.
# only a single pair of on/off values is provided. 
#
# Code was added for many edge cases:
#   sun-up already before schedule-on; sun or schedule times past midnight;
#   24 hour sun up in the far north; sunrise but no sunset, because midsummer started
#   These edge cases do make the code a little less readable, when you encounter
#   a weird conditional construct, assume it is for an edge case. I hope a nearby
#   comment line will explain which one.
# (Yes, I wrote this for a Camping in Sweden, these are actual occuring cases)
#
# All devices configure and work as one by means of UDP broadcast.
# Even though each device does its own calculations, it also turns on based on broadcast
# so they all switch at the exact same moment even when their cycles run a few seconds out of step
#  
# DETAILS
#
# Daily cycle, set by two switches, USE_SUN and USE_SCHEDULE:
#   Sun+Schedule   Morning  schedule_on -> sun_up      (lamp on before the sun is up)
#                  Evening  sun_down -> schedule_off   (lamp on after the sun is down)
#                  So between schedule_off and schedule_on the lamp has a pause.
#   Sun only       sun_down -> sun_up                  (lamp on the entire night)
#   Schedule only  schedule_on -> schedule_off         (no sun involved)
#   Neither        the cycle does nothing: the lamp is only switched by the
#                  wall switch or by HA or by any group member with a wall switch
#
# Sun level select, what counts as sun up / down (with Use sun on):
#   Normal      -0.833 degrees, the official sunrise / sunset
#   Half Civil  -3 degrees
#   Civil       -6 degrees (lamp on longer)
#
# TIMEZONE and LOCATION are set by the user. Alas it is a little tricky to pick them
# up automatically from an optional HA (easy to pick up, but tricky to next store past reboot)
# The timezone is a POSIX string, not a name, for example
#   Europe/Amsterdam = CET-1CEST,M3.5.0,M10.5.0/3
#   UTC              = UTC0
# If you blank out the timezone, it and the location are repopulated from
# compile defaults, so user is reminded what format to use. Input is not validated
#
# The sun times are calculated locally. No internet needed, only a valid clock.
#
# SUN MOMENT While the next sun events are used in text, the actual lamp decision uses
# the current sun elevation, not the calculated sun event clock time.
# The reason is the sunup/sundown functions return the "next sunup/sundown" and these 
# glitch to next day when we transition them. The elevation value does not have such  
# glitch as it returns the current elevation of the sun.
# To put it simply: we do not check "now past sunset" but "sun below horizon"
#
# CLOCK: Without a valid clock the sun and schedule cycle can do nothing. The wall
# switch, SENSOR and MOTION keep working, as a missing clock must not disable a light.
# Time is taken from HA (if available) or NTP 
# -with- a valid clock, reboots are avoided, instead prolonged loss of connectivity 
# will cycle the WiFi module. After 7 days of no connectivity, we give in and reboot
# -without- a valid clock but -with- a cycle that needs one, we reboot after only 6 hours.
#
# LABEL: This is a user mnemonic label, so they know which device. Chalet14 or Lamp03
# Advise is to rename in HA to this as Friendlyname. Ideally this is also used
# as DHCP/DNS/mDNS hostname, but that does not work yet
#
# GROUP: All devices have a groupname, and all in the same GROUP sync themselves.
# They sync lamp state and config over UDP with plain text packet.
#
#   LAMPGROUP:<group>:<PARAMETER>:<value>
#   LAMPGROUP:<group>:REQCONFIG
#   LAMPGROUP:<group>:RECONNECT
#
# The group name can not contain a colon. The value is everything after the
# third colon (times have colons). The parameter is the uppercase ID of the
# entity:
#   LAMP         1 / 0      the lamp state itself
#   SENSOR       1 / 0      a daylight sensor somewhere in the group says dark
#   MOTION       1 / 0      a motion sensor somewhere in the group says motion
# (SENSOR and MOTION are a state: not part of the config dump LAMP is also a
#  state, but is synced anyway to avoid the delay of the 1 minute update cycle )
#   USE_SUN      1 / 0
#   USE_SCHEDULE 1 / 0
#   TWILIGHT     Normal / Half Civil / Civil
#   LOC_LAT      decimal degrees
#   LOC_LON      decimal degrees
#   TZ_TEXT      POSIX timezone string
#   SCHEDULE_ON  HH:MM:SS
#   SCHEDULE_OFF HH:MM:SS
# Not sent are these values, which are unique to each device
#   GROUP        This is what selects the group.
#   LABEL        The label is what makes it the device memorable to the operator
#   USE_SENSOR   Some devices might have a light sensor
#   USE_MOTION   Some devices might have a motion sensor 
#                Note that no sensor input implies a hotel/hallway wall switch
#
# - Every lamp calculates its own cycle. The lamp that gets to a light state first 
#   switches its own lamp and broadcasts LAMP so the others follow, so the
#   first one wins but all lamps appear to switch exactly at the same time.
#   Without the network each lamp still runs on its own with a few seconds variation.
#
# - Read the section about sync strategy below for more details
#
# INPUTS: SENSOR and MOTION actions versus the USE_SENSOR and USE_MOTION switches
#
# SENSOR and MOTION are actions (state). They can be set by HA, by the wall switch
# input, or by a received packet. They are distributed: the lamp that is activated
# tells the group, so an HA automation only needs to drive one device.
#
# USE_SENSOR and USE_MOTION are config: they say that the wall switch input is
# wired to such a sensor and sets the action. That is hardware, so they are not
# distributed. They are mutually exclusive: turning one on turns the other off.
# With both off, the input is a hotel/hallway switch, toggling on every edge.
#
# SENSOR  Forces "dark". With USE_SUN, or schedule only, it widens the dark.
#         Without sun and schedule, SENSOR simply turns the lamp on.
#         It never overrides the night pause or a manual switch.
#         With only USE_SENSOR configured, the device is a classic light sensor
#         broadcaster, the other lamps follow it.
# MOTION  While on, and the sun is below the level (regardless of USE_SUN or
#         USE_SCHEDULE), the lamp is on. It overrides the night pause.
#         Without a valid clock it simply turns the lamp on.
#         With only USE_MOTION configured, the device is a classic motion sensor
#         broadcaster, the other lamps follow it.
# When SENSOR or MOTION turns off, lamp_update runs and the lamp returns to
# the state of the normal cycle.
#
# Stuck states: a received MOTION or SENSOR expires after 10 min. The lamp that
# originated it repeats MOTION, SENSOR and LAMP every 5 min while it is on, which
# also refreshes the expiry on the others. LAMP and the actions are sent both,
# so a LAMP that arrives from a sensor edge is harmless: an equal value is ignored.
# 
# TODO: the 5 minute repeat should only be driven from a local wall switch connected
# device. When it was some HA automation drive, or WebUI drive, the repeat should be 
# made by HA. In essense, HA should provide a keepalive to a MOTION or SENSOR state
#
# INFO:
# "Twilight info" text sensor shows the next calculated sun_up / sun_down.
# "Lamp schdule" text sensor shows the calculated on-off schedule
#
# Everything defaults to the safe state at boot: relay off, until the cycle
# has a valid clock and switches it on when needed.
#
#
# DEVICE SYNC STRATEGY
#
# Transport: UDP broadcast only, every packet is sent twice,
# because UDP is lossy. Multicast was tried but dropped on IGMP snooping issues
#
# Every parameter change is broadcast as LAMPGROUP:<group>:<PARAM>:<value>.
# A received value, if different, is applied but not re-sent.
# Subsequent packets are queued 20 ms apart
# Purely local parameters are not sent: GROUP, LABEL, USE_SENSOR, USE_MOTION
#
# TODO The lamp itself: The first lamp state restore after wifi connect is not broadcast
#
# FLAGS
#   group_synced    Remembered across reboots. "My config is current, I may
#                   answer other lamps."
#   group_peers     Remembered across reboots. "I have seen other lamps in
#                   my group." Set by any received packet from the group.
#   sync_is_suspect Evaluated at boot, not remembered: "I claim to be synced
#                   merely because I never saw peers?"
#                   A lone device that may just now have been moved, like a workbench lamp
#                   and may hold wrong config. Cleared by a receiving a full config set
#   All of the 3 above flags are cleared when user enters a new GROUP name
#
# PACKETS
#   REQCONFIG   "Send me your config." Sent at once after a user changes the GROUP,
#               and about 5 s after connecting when we were never before synced.
#               or our sync is suspect.
#   RECONNECT   "I just (re)connected." Sent after boot or WiFi reconnect by a lamp
#               that was synced before, but after a random 20-30 minute delay, so a site-wide
#               power outage does not cause a request storm and also other network
#               infrastructure can boot first. Also sent about 5s after a local WiFi cycle.
#               As config rarely changes, working with 20-30 minute stale config is
#               acceptable as long as it is not send out.
#   Both are answered with a staggered but fast configuration dump by all synced devices
#
# ANSWERING
#   A lamp answers with all parameters, after a random 0-500 ms delay, but only
#   when the device has group_synced status. An unsynced lamp stays quiet.
#   A sync_is_suspect lamp answers only after 1 minute extra, and drops its answer
#   if any other lamps answer first. This is so an isolated workbench lamp cannot poison
#   the group with stale config when it is brought back into the field. The suspect lamp
#   still answers a REQCONFIG immediately, as that is a deliberate operator action.
#   This means that adding a 2nd lamp to an otherwise empty group is not annoyingly
#   slow for the operator
#
# BECOMING SYNCED
#   - When all 9 parameters have been seen since last wifi reconnect, from any mix of
#     lamps. Allowing a mix of lamps reduces the issue with UDP drops.
#   - If 10 s after our own REQCONFIG nothing from our group arrived and we never seen
#     any peers, we are alone, so we declare ourselves synced.
#   - If any packet arrived, we have peers, so only the full set will make us synced.
#   - A lamp that requested config but never seen all 9 parameters repeats the request
#     every 5 min until it has all of them.
#
# ORDER OF SENDING ALL CONFIG (aka, THE DUMP)
#   LAMP first, the two USE_ switches last. A received USE_SUN or USE_SCHEDULE
#   starts eval_quiet, which waits 500 ms and then evaluates the cycle once,
#   so the switches mark the end of the series. The minute tick corrects it
#   anyway if a switch is lost.
#   MOTION and SENSOR are not in the dump. They are state, and the expiry heals a
#   lamp that missed one.


substitutions:
  devicename: outdoor-lamp
  description: Outdoor lamp controller.
  prj_version: "2026.10.29"

  # Pins
  # Relay boards often are active low, if so set inverted: true on the relay
  # Defaults are for a classic Shelly1 which I use on almost all of these lantarns
  # Warning to self: Dont use as is for the newer Shellys

  # values for Shelly-1, a ESP8266 with 2MB 
  # take note of the platform overrides below. If you change the board, it needs review
  use_board:       esp01_1m  # works for Shelly1 but override to 2M
  show_board:      Shelly1   # string shown in HA
  GPIO_relay:      GPIO4     # shelly-1 relay 
  relay_inverted:  false
  GPIO_wall_input: GPIO5     # shelly-1 wall switch input
  wall_inverted:   false
  wall_pullup:     false
  GPIO_Status_LED: GPIO2     # shelly-1 does not have, pick any

  # values for my custom ESP12F nibe AUX & temperature PCB
  # take note of the platform overrides below. If you change the board, it needs review
#  show_board:      ESP12F    # string shown in HA
#  GPIO_relay:      GPIO4     # esp12f nibe AUX & temperature PCB
#  relay_inverted:  true      # all my ESP12F have the relay driven by a FET
#  GPIO_wall_input: GPIO5     # 
#  GPIO_Status_LED: GPIO2     # esp12f build in LED

  # Defaults of the runtime settings, used until the user changes them
  # for twilight calculations, 1 digit is enough, lets not burden user unput
  # Default at Tiveden, because that's where I'll be using them, you can put in yours
#  default_latitude:  "58.7" # Tiveden, SE
#  default_longitude: "14.6" # Tiveden, SE
  default_latitude:  "51.6" # Fijnaart, NL
  default_longitude: "4.5"  # Fijnaart, NL
  default_timezone:  "CET-1CEST,M3.5.0,M10.5.0/3"   # POSIX string
  default_group:     "outdoor"

  # UDP group transport. All lamps need the same addresses and port.
  # Every packet goes to both addresses (stale, multi is now ignored).
  udp_broadcast: 255.255.255.255
  udp_multicast: 239.0.60.53
  udp_port: "18511"

#######################################################################################

esphome:
  name: ${devicename}
  comment: "${description} v${prj_version} on ${show_board}"
  friendly_name: ${devicename}
  name_add_mac_suffix: true  
  project:
    name: "${show_board}.${devicename}"
    version: "${prj_version}"
  on_boot:
    priority: -100
    then:
      - lambda: 'id(sync_is_suspect) = !id(group_peers).state && id(group_synced).state;'
      - lambda: 'id(boot_done) = true;'
      - script.execute: lamp_update
  # Override to 2MB for the classic Shelly1, also fine on the ESP12F
  platformio_options:
    board_upload.flash_size: 2MB
    board_build.ldscript: eagle.flash.2m64.ld

esp8266:
  board: ${use_board}
  restore_from_flash: true

logger:
  level: DEBUG
  initial_level: INFO
  logs:
    status_led: NONE

#debug:
#  update_interval: 10s

api:
  # This device works without HA, and we avoid reboots so we do not loose time
  # However prolonged lack of time sync will cycle the wifi module
  # and 7 days no time sync will finally do a reboot
  reboot_timeout: 0s

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # This device works without HA, and we avoid reboots so we do not loose valid time
  # A separate wifi restart and reboot loop exists elsewhere
  reboot_timeout: 0s
  # The UDP reception stability does not like this optimization
  # A separate wifi restart loop exists elsewhere
  power_save_mode: none
  fast_connect: false
  post_connect_roaming: false
  on_connect:
    # Uncompleted experiment to update the DHCP/DNS hostname
#   - script.execute: hostname_apply
    # This reads the gateway and assumes it is a NTP server
    - script.execute: net_setup
    # On every (re)connect: ask the group for the latest config
    - script.execute: group_request
  ap:
    ssid: "${devicename} fallback hotspot"
    # Open on purpose: easier recovery

captive_portal:

# Note: v3 loads its JS from oi.esphome.io, so the WebUI would need internet.
# unless if we force local at 100KB cost. remove when running on a 1MB flash device
web_server:
  port: 80
  version: 3
#  I used to think I liked local, but the 100K javascript being served makes the device laggy
#  over a group of devices on the edge of an overreaching wifi. 
#  local: true

#######################################################################################

# Group transport, see the header for the packets
udp:
  id: lamp_udp
  port: ${udp_port}
#  listen_address: ${udp_multicast}
  # udp.write sends to every address in this list: each packet goes out twice
  # I seem to not be able to make multicast work stable in any meaningful way. 
  addresses:
    - ${udp_broadcast}
#    - ${udp_multicast}
  on_receive:
    then:
      - lambda: |-
      
          std::string s(data.begin(), data.end());
          const std::string magic = "LAMPGROUP:";
          std::string group = id(device_group).state;
          ESP_LOGD("udp", "in: %s", s.c_str());
          if (group.empty() || s.compare(0, magic.size(), magic) != 0) {
            return;
          }

          // LAMPGROUP:<group>:<param>[:<value>]
          size_t g_end = s.find(':', magic.size());
          if (g_end == std::string::npos ||
              s.substr(magic.size(), g_end - magic.size()) != group) {
            return;                               // other group
          }
          // g = groupname; p = parameter; v = value :
          // Probably want to rename these, so the code below reads better to humans :
          size_t p_end = s.find(':', g_end + 1);
          std::string param = s.substr(g_end + 1,
              p_end == std::string::npos ? std::string::npos : p_end - g_end - 1);
          std::string v = (p_end == std::string::npos) ? "" : s.substr(p_end + 1);

          if (param == "REQCONFIG" || param == "RECONNECT") {
            // For 2 seconds, ignore as likely our own request coming back as an echo :
            if (!(id(req_sent) && millis() - id(last_req_ms) < 2000)) {
              if (!id(group_peers).state) id(group_peers).turn_on();
              if (id(group_synced).state) {
                // Only a suspect lamp answers a RECONNECT slowly :
                id(dump_slow) = (param == "RECONNECT") && id(sync_is_suspect);
                id(group_dump).execute();
              }
            }
            return;
          }


          // Any other packet from our group proves a peer exists :
          if (!id(group_peers).state) id(group_peers).turn_on();
          // Others are answering: Device is not alone and a pending slow dump is not needed 
          if (id(sync_is_suspect) && id(group_dump).is_running()) id(group_dump).stop();

          // All 9 parameters seen since the reconnect, from any mix of lamps :
          static const char *names[] = {"LAMP", "TWILIGHT", "LOC_LAT", "LOC_LON", "TZ_TEXT",
                                        "SCHEDULE_ON", "SCHEDULE_OFF", "USE_SUN", "USE_SCHEDULE"};
          for (int i = 0; i < 9; i++) {
            if (param == names[i]) {
              id(rx_mask) |= (1u << i);
              break;
            }
          }
          // Yes, we got all 9 parameters :
          if (id(rx_mask) == 0x1FF) {
            id(rx_mask) = 0;
            id(sync_is_suspect) = false;
            id(group_synced).turn_on();
            id(group_live) = true;
            id(group_request).stop();
            ESP_LOGD("udp", "in: all parameters seen");
          }


          // Apply, but do not send it on again, and do not evaluate the
          // cycle on half a config (cfg_hold).
          id(tx_mute) = true;
          id(cfg_hold) = true;
          
          if (param == "LAMP") {
            bool on = (v == "1");
            //if (on != id(lamp_output).current_values.is_on()) {
            if (on != id(lamp_output).remote_values.is_on()) {
              if (on) {
                id(lamp_output).turn_on().perform();
              } else {
                id(lamp_output).turn_off().perform();
              }
            }
            if (!on && id(motion_act).state) {
              // LAMP 0 from the group ends motion: motion off or operator override
              id(motion_rx_ms) = 0;
              id(motion_act).turn_off();
            }
            
          } else if (param == "USE_SCHEDULE") {
            bool on = (v == "1");
            if (on != id(use_schedule).state) {
              if (on) {
                id(use_schedule).turn_on();
              } else {
                id(use_schedule).turn_off();
              }
            }
            
          } else if (param == "USE_SUN") {
            bool on = (v == "1");
            if (on != id(use_sun).state) {
              if (on) {
                id(use_sun).turn_on();
              } else {
                id(use_sun).turn_off();
              }
            }
            
          } else if (param == "TWILIGHT") {
            if (id(twilight).has_option(v) &&
                std::string(id(twilight).current_option()) != v) {
              id(twilight).make_call().set_option(v).perform();
            }
            
          } else if (param == "LOC_LAT") {
            float f = atof(v.c_str());
            if (std::isnan(id(loc_lat).state) || fabsf(f - id(loc_lat).state) > 0.0005f) {
              id(loc_lat).make_call().set_value(f).perform();
            }
            
          } else if (param == "LOC_LON") {
            float f = atof(v.c_str());
            if (std::isnan(id(loc_lon).state) || fabsf(f - id(loc_lon).state) > 0.0005f) {
              id(loc_lon).make_call().set_value(f).perform();
            }
            
          } else if (param == "TZ_TEXT") {
            if (!v.empty() && id(tz_text).state != v) {
              id(tz_text).make_call().set_value(v).perform();
            }
            
          } else if (param == "MOTION") {
            bool on = (v == "1");
            id(motion_rx_ms) = on ? millis() : 0;
            if (on != id(motion_act).state) {
              if (on) id(motion_act).turn_on(); else id(motion_act).turn_off();
            }
            
          } else if (param == "SENSOR") {
            bool on = (v == "1");
            id(sensor_rx_ms) = on ? millis() : 0;
            if (on != id(sensor_act).state) {
              if (on) id(sensor_act).turn_on(); else id(sensor_act).turn_off();
            }
            
          } else if (param == "SCHEDULE_ON" || param == "SCHEDULE_OFF") {
            int h = 0, m = 0, sec = 0;
            if (sscanf(v.c_str(), "%d:%d:%d", &h, &m, &sec) == 3 &&
                h >= 0 && h < 24 && m >= 0 && m < 60 && sec >= 0 && sec < 60) {
              if (param == "SCHEDULE_ON") {
                if (id(schedule_on).hour != h || id(schedule_on).minute != m || id(schedule_on).second != sec) {
                  id(schedule_on).make_call().set_time(h, m, sec).perform();
                }
              } else {
                if (id(schedule_off).hour != h || id(schedule_off).minute != m || id(schedule_off).second != sec) {
                  id(schedule_off).make_call().set_time(h, m, sec).perform();
                }
              }
            }
          }
          
          id(cfg_hold) = false;
          id(tx_mute) = false;
          // The switches come last in a series. Evaluate once, shortly after
          // the last packet, without broadcasting.
          if (param == "USE_SCHEDULE" || param == "USE_SUN" || param == "MOTION" || param == "SENSOR") {
            id(eval_quiet).execute();
          }


time:
  # Two sources, both set the same system clock, so time is valid after a
  # reboot even if HA is not up yet (or the gateway has no NTP).
  # The lambdas use ha_time.now(), which reads that shared clock.
  # The timezone is set from the Timezone text, see lamp_update.
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - lambda: 'id(unsynced_hours) = 0;'
      - script.execute: lamp_update

  - platform: sntp
    id: ntp_time
    timezone: ${default_timezone}
    # Start values only.
    # When WiFi connects, net_setup adds the DHCP gateway
    # as server 1 and the pool server becomes server 2.
    servers:
      - 0.pool.ntp.org
    on_time_sync:
      - lambda: 'id(unsynced_hours) = 0;'
      - script.execute: lamp_update

# Sun position and sunrise/sunset, calculated locally.
# Latitude / longitude here are only the start values, lamp_update sets
# them from the Latitude / Longitude numbers.
sun:
  id: sun_sun
  time_id: ha_time
  latitude: ${default_latitude}
  longitude: ${default_longitude}

#######################################################################################

globals:
  # What the lamp should be by the cycle: -1 unknown, 0 off, 1 on
  - id: lamp_target
    type: int
    initial_value: '-1'
  # What the cycle last set. -1 = not yet set since boot / enable.
  - id: lamp_applied
    type: int
    initial_value: '-1'
  # True while a change must not be broadcast (a received one)
  - id: tx_mute
    type: bool
    initial_value: 'false'
  # True during the first apply after boot / enable: not broadcast either
  - id: quiet_apply
    type: bool
    initial_value: 'false'
  # True while a config is half changed: lamp_update does nothing
  - id: cfg_hold
    type: bool
    initial_value: 'false'
  # False while the restored values are put back at boot
  # (may not be needed. no on_value runs by the boot based initiation)
  - id: boot_done
    type: bool
    initial_value: 'false'
  # False until WiFi is up and the group was asked for its config.
  # Stops the restored values at boot from being broadcast.
  - id: group_live
    type: bool
    initial_value: 'false'
  # Time of our own last REQCONFIG, to ignore its echo
  - id: req_sent
    type: bool
    initial_value: 'false'
  - id: last_req_ms
    type: uint32_t
    initial_value: '0'
  # Packets waiting to be sent, one every 20 ms (see group_flush)
  # we stagger the send of UDP to avoid issues with accasional buffer problems on UDP send
  - id: udp_queue
    type: std::vector<std::string>
  # Hours since the last time sync (NTP or HA), counted by the hourly interval
  - id: unsynced_hours
    type: int
    initial_value: '0'
    
  # We keep track if we received all config parameters over the network
  # Keep a bitmask field which parameters have been received
  - id: rx_mask
    type: uint32_t
    initial_value: '0'
  # A manual group change does an immediate requestconfig  
  - id: req_fast
    type: bool
    initial_value: 'false'
  # Evaluated at boot: remembers synced but never saw peers. A lone device that may have moved.
  - id: sync_is_suspect
    type: bool
    initial_value: 'false'
  # Set per received request: answer slowly (suspect lamp, RECONNECT)
  - id: dump_slow
    type: bool
    initial_value: 'false'
  # WiFi cycle: RECONNECT after a short wait for DHCP
  - id: req_after_cycle
    type: bool
    initial_value: 'false'
  # Kind of request being sent: true = REQCONFIG, false = RECONNECT
  - id: req_is_request
    type: bool
    initial_value: 'false'

  # The lamp was last driven by MOTION or SENSOR (not by the cycle)
  - id: ms_driven
    type: bool
    initial_value: 'false'
  # millis() of a received MOTION/SENSOR on. 0 = off, or driven locally.
  # A received one expires after 10 min unless refreshed.
  - id: motion_rx_ms
    type: uint32_t
    initial_value: '0'
  - id: sensor_rx_ms
    type: uint32_t
    initial_value: '0'


output:
  - platform: gpio
    pin: ${GPIO_relay}
    id: relay_output
    inverted: ${relay_inverted}
    # Use "inverted: true" if the relay board is active low
    
  
light:
  # Visual watchdog, blinked from the interval below
  - platform: status_led
    name: "Led"
    id: led_output
    pin:
      number: ${GPIO_Status_LED}
      inverted: true
    restore_mode: ALWAYS_OFF
    internal: true

  # The lamp. Switched by the cycle, the group, the wall switch and HA.
  # Every change is broadcast, see group_send.
  - platform: binary
    output: relay_output
    name: "Lamp"
    id: lamp_output
    icon: mdi:outdoor-lamp
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute:
          id: group_send
          param: "LAMP"
    on_turn_off:
      - script.execute:
          id: group_send
          param: "LAMP"
    web_server:
      sorting_weight: 100

switch:
  # Use the schedule_on / schedule_off times. See the header.
  - platform: template
    name: "Use schedule"
    id: use_schedule
    icon: mdi:clock-outline
    entity_category: config
    disabled_by_default: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: lamp_update
      - script.execute:
          id: group_send
          param: "USE_SCHEDULE"
    on_turn_off:
      - script.execute: lamp_update
      - script.execute:
          id: group_send
          param: "USE_SCHEDULE"
    web_server:
      sorting_weight: 200

  # Use the sun. See the header.
  - platform: template
    name: "Use sun"
    id: use_sun
    icon: mdi:weather-sunny
    entity_category: config
    disabled_by_default: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: lamp_update
      - script.execute:
          id: group_send
          param: "USE_SUN"
    on_turn_off:
      - script.execute: lamp_update
      - script.execute:
          id: group_send
          param: "USE_SUN"
    web_server:
      sorting_weight: 202

  - platform: template
    name: "Sensor"
    id: sensor_act
    icon: mdi:weather-night
    optimistic: true
    restore_mode: ALWAYS_OFF
    disabled_by_default: true
    on_turn_on:
      - lambda: 'if (!id(tx_mute)) id(sensor_rx_ms) = 0;'
      - script.execute: lamp_update
      - script.execute:
          id: group_send
          param: "SENSOR"
    on_turn_off:
      - lambda: 'if (!id(tx_mute)) id(sensor_rx_ms) = 0;'
      - script.execute: lamp_update
      - script.execute:
          id: group_send
          param: "SENSOR"
    web_server:
      sorting_weight: 141

  - platform: template
    name: "Motion"
    id: motion_act
    icon: mdi:motion-sensor
    optimistic: true
    restore_mode: ALWAYS_OFF
    disabled_by_default: true
    on_turn_on:
      - lambda: 'if (!id(tx_mute)) id(motion_rx_ms) = 0;'
      - script.execute: lamp_update
      - script.execute:
          id: group_send
          param: "MOTION"
    on_turn_off:
      - lambda: 'if (!id(tx_mute)) id(motion_rx_ms) = 0;'
      - script.execute: lamp_update
      - script.execute:
          id: group_send
          param: "MOTION"
    web_server:
      sorting_weight: 142

  # Use wall switch as daylight sensor. See the header.
  - platform: template
    name: "Connect daylight sensor"
    id: use_sensor
    icon: mdi:weather-night
    entity_category: config
    disabled_by_default: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - switch.turn_off: use_motion
      - if:
          condition:
            binary_sensor.is_on: wall_switch
          then:
            - switch.turn_on: sensor_act
    on_turn_off:
      - switch.turn_off: sensor_act
    web_server:
      sorting_weight: 253

  # Use wall switch as motion sensor. See the header.
  - platform: template
    name: "Connect motion sensor"
    id: use_motion
    icon: mdi:motion-sensor
    entity_category: config
    disabled_by_default: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - switch.turn_off: use_sensor
      - if:
          condition:
            binary_sensor.is_on: wall_switch
          then:
            - switch.turn_on: motion_act
    on_turn_off:
      - switch.turn_off: motion_act
    web_server:
      sorting_weight: 254


  # Remembered. "My config is current, I may answer." Cleared by a user group change.
  - platform: template
    name: "_Group synced"
    id: group_synced
    entity_category: diagnostic
    disabled_by_default: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  # Remembered. "I have seen another lamp in my group." Cleared by a user group change.
  - platform: template
    name: "_Group has peers"
    id: group_peers
    entity_category: diagnostic
    disabled_by_default: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    
  # Dynamic activation of debug messages
  - platform: template
    name: "_Debug log"
    id: debug_log
    entity_category: diagnostic
    disabled_by_default: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - logger.set_level:
          level: DEBUG
    on_turn_off:
      - logger.set_level:
          level: INFO


binary_sensor:
  # Wall switch. Either a state based SENSOR or MOTION device or a edge based
  # hotel or hallway switch
  - platform: gpio
    pin:
      number: ${GPIO_wall_input}
#      mode: INPUT_PULLUP
      inverted: ${wall_inverted}
    id: wall_switch
    internal: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_state:
      - lambda: |-

          if (id(use_sensor).state) {
            // Wall input is a daylight sensor: SENSOR follows the input 
            if (x) id(sensor_act).turn_on(); else id(sensor_act).turn_off();
            
          } else if (id(use_motion).state) {
            // Wall input is a motion sensor: MOTION follows the input
            if (x) id(motion_act).turn_on(); else id(motion_act).turn_off();
            
          } else {
            // Hotel/hallway switch: every edge toggles the lamp.
            id(lamp_output).toggle().perform();
          }
         

select:
  # What counts as sun up / down
  - platform: template
    name: "Twilight level"
    id: twilight
    icon: mdi:weather-sunset
    optimistic: true
    restore_value: true
    options:
      - Normal
      - Half Civil
      - Civil
    initial_option: Normal
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_weight: 205
    on_value:
      then:
        - script.execute: lamp_update
        - script.execute:
            id: group_send
            param: "TWILIGHT"


number:
  # Location latitude and Longitude for sun calculations
  # for sun calculations, 1 digit is enough, lets not make input too difficult
  - platform: template
    name: "Location Latitude"
    id: loc_lat
    icon: mdi:latitude
    entity_category: config
    disabled_by_default: true
    optimistic: true
    restore_value: true
    initial_value: ${default_latitude}
    min_value: -90
    max_value: 90
    step: 0.1
    mode: box
    unit_of_measurement: "°"
    web_server:
      sorting_weight: 240
    on_value:
      then:
        - script.execute: lamp_update
        - script.execute:
            id: group_send
            param: "LOC_LAT"

  - platform: template
    name: "Location Longitude"
    id: loc_lon
    icon: mdi:longitude
    entity_category: config
    disabled_by_default: true
    optimistic: true
    restore_value: true
    initial_value: ${default_longitude}
    min_value: -180
    max_value: 180
    step: 0.1
    mode: box
    unit_of_measurement: "°"
    web_server:
      sorting_weight: 241
    on_value:
      then:
        - script.execute: lamp_update
        - script.execute:
            id: group_send
            param: "LOC_LON"


text:
  # Short memorable unique user assigned name, potentially 
  # used for DNS/DHCP and advised as renamed friendly name in HA
  - platform: template
    name: "Device Label"
    id: device_label
    icon: "mdi:tag-text"
    mode: text
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 32
    web_server:
      sorting_weight: 110
    on_value:
      then:
        # Hostname-safe: letters, digits and inner dashes only. Empty is allowed.
        # Capitals are also allowed. Ignored by DNS, but allowed visually
        - lambda: |-
            std::string h;
            for (char c : x) {
              if (isalnum((unsigned char) c)) {
                h += c;
              } else if (!h.empty() && h.back() != '-') {
                h += '-';
              }
            }
            while (!h.empty() && h.back() == '-') h.pop_back();
            if (h != x) {
              id(device_label).make_call().set_value(h).perform();
              id(device_label).publish_state(h);   // force the clean text to the front end
            }


  # Name of the lamp group. Not broadcast: it selects the group. A new
  # name asks that group for its config.
  - platform: template
    name: "Device Group"
    id: device_group
    icon: mdi:lightbulb-group-outline
    mode: text
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "${default_group}"
    min_length: 0
    max_length: 32
    web_server:
      sorting_weight: 120
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(boot_done);'
            then:
              - switch.turn_off: group_synced
              - switch.turn_off: group_peers
              - lambda: |-
                  id(sync_is_suspect) = false;
                  id(req_fast) = true;
              - script.execute: group_request


  # POSIX timezone string, see the header
  - platform: template
    name: "Location Timezone"
    id: tz_text
    icon: mdi:map-clock
    mode: text
    entity_category: config
    disabled_by_default: true
    optimistic: true
    restore_value: true
    initial_value: "${default_timezone}"
    min_length: 0
    max_length: 64
    web_server:
      sorting_weight: 242
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x.empty();'
            then:
              # Emptied by the user: put the compile defaults back, all three
              # so that a user messing about gets a plausible example what to put there
              - script.execute: reset_location
            else:
              # conditional, because update above spun up another parallel on_value
              - script.execute: lamp_update
              - script.execute:
                  id: group_send
                  param: "TZ_TEXT"


datetime:
  # Time points of the cycle.
  # With USE_SUN Morning window starts at schedule_on, evening window ends at schedule_off.
  # Without USE_SUN Night starts at schedule_on, night ends at schedule_off.
  - platform: template
    type: time
    name: "Schedule on"
    id: schedule_on
    icon: mdi:clock-outline
    entity_category: config
    disabled_by_default: true
    optimistic: true
    restore_value: true
    initial_value: "05:30:00"
    web_server:
      sorting_weight: 220
    on_value:
      then:
        - script.execute: lamp_update
        - script.execute:
            id: group_send
            param: "SCHEDULE_ON"
  - platform: template
    type: time
    name: "Schedule off"
    id: schedule_off

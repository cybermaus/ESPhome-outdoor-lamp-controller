interval:
  # Every 10 seconds blink the LED for 0.1 s: visual "still running"
  - interval: 10seconds
    then:
      - output.set_level:
          id: led_output
          level: !lambda 'return id(led_level).state / 10.0;'
      - delay: 0.2s
      - output.turn_off: led_output

  # Every minute re-evaluate the cycle
  - interval: 1min
    then:
      # minute ticker in the log
      - lambda: |-
          auto time = id(ha_time).now();
          ESP_LOGD("sun", "time=%s valid=%d TZ='%s' lat=%.1f lon=%.1f elev=%.1f", time.strftime("%Y-%m-%d %H:%M:%S %z").c_str(),
            time.is_valid(), id(tz_text).state.c_str(), id(loc_lat).state, id(loc_lon).state,
            id(sun_sun).elevation());
      # Every minute we check net_setup, which might adjust the NTP server based on time health
      - script.execute: net_setup
      # Every minute: show the age of the last clock sync in the diagnostics
      - lambda: |-
          if (id(last_clock_sync_ms) == 0) {
            id(sync_age).publish_state("never");
          } else {
            char b[24];
            snprintf(b, sizeof(b), "%u minutes", (unsigned) ((millis() - id(last_clock_sync_ms)) / 60000));
            id(sync_age).publish_state(b);
          }
      # Every minute: a received MOTION/SENSOR expires after 10 min without refresh
      # it needs a keepalive from the source-device or from HA when set from HA
      - lambda: |-
          id(tx_mute) = true;
          if (id(motion_keepalive_ms) && millis() - id(motion_keepalive_ms) > 601000) {
            id(motion_keepalive_ms) = 0;
            id(motion_act).turn_off();
          }
          if (id(sensor_keepalive_ms) && millis() - id(sensor_keepalive_ms) > 601000) {
            id(sensor_keepalive_ms) = 0;
            id(sensor_act).turn_off();
          }
          id(tx_mute) = false;
      - script.execute: lamp_update


  # Every 5 min: the lamp that originated MOTION/SENSOR repeats it, plus LAMP
  - interval: 5min
    then:
      - if:
          condition:
            lambda: 'return (id(motion_act).state && id(motion_keepalive_ms) == 0) || (id(sensor_act).state && id(sensor_keepalive_ms) == 0);'
          then:
            - script.execute:
                id: group_send
                param: "LAMP"
            - if:
                #if MOTION originated here, then resend it every 5 minutes
                condition:
                  lambda: 'return id(motion_act).state && id(motion_keepalive_ms) == 0;'
                then:
                  - script.execute:
                      id: group_send
                      param: "MOTION"
            - if:
                #if SENSOR originated here, then resend it every 5 minutes
                condition:
                  lambda: 'return id(sensor_act).state && id(sensor_keepalive_ms) == 0;'
                then:
                  - script.execute:
                      id: group_send
                      param: "SENSOR"


  # Every hour: count hours without a time sync, and act on it.
  # We have valid clock, reboot after 30 days
  # we have no valid clock, but do need one, reboot after 6 hours
  - interval: 1h
    then:
      - lambda: |-

          // hours since the last clock sync, or since boot when never synced:
          uint32_t last = id(last_clock_sync_ms);
          uint32_t age_ms = last ? (millis() - last) : millis();
          int h = age_ms / 3600000;
          bool clock_valid = id(ha_time).now().is_valid();
          bool needs_clock = id(use_sun).state || id(use_schedule).state;

          // Reboot: 30 days without any sync, or 6 hours without a valid clock
          // while the cycle needs one. Otherwise do nothing.
          // note that the ms counter cycles at 49 days, so 45 days would be the max
          if (h >= 720 || (h >= 6 && !clock_valid && needs_clock)) {
            App.safe_reboot();
          }


button:
# Common diagnostic text buttons from common/diagnostics.yaml added from packages

  - platform: template
    name: "_Group writeout peers"
    id: peers_log
    entity_category: diagnostic
    disabled_by_default: true
    internal: true # many diagnistics are not send to HA to minimize traffic
    on_press:
      - if:
          condition:
            lambda: 'return ! id(device_group).state.empty();'
          then:
            - script.execute:
                id: udp_tx
                msg: !lambda 'return "LAMPGROUP:" + id(device_group).state + ":HELLO;";'
      - lambda: |-
          ESP_LOGI("peers", "--- peers seen: %d ---", (int) id(peers).size());
          for (auto &q : id(peers)) {
            size_t c1 = q.find(',');
            size_t c2 = q.find(',', c1 + 1);
            ESP_LOGI("peers", "http://%s %s %s", q.substr(c1 + 1, c2 - c1 - 1).c_str(),
                     q.substr(0, c1).c_str(), q.substr(c2 + 1).c_str());
          }



#      - lambda: |-
#          const std::string &h = id(device_label).state;
#          if (h.empty() || h == wifi_station_get_hostname()) {
#            return;
#          }
#          wifi_station_set_hostname(const_cast<char *>(h.c_str()));
#          for (netif *intf = netif_list; intf; intf = intf->next) {

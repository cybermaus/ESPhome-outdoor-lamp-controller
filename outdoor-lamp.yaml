    web_server:
      sorting_weight: 240
    on_value:
      then:
        - script.execute: lamp_update
        - script.execute:
            id: group_send
            param: "LOC_LAT"

  - platform: template
    name: "Location Longitude"
    id: loc_lon
    icon: mdi:longitude
    entity_category: config
    disabled_by_default: true
    optimistic: true
    restore_value: true
    initial_value: ${default_longitude}
    min_value: -180
    max_value: 180
    step: 0.1
    mode: box
    unit_of_measurement: "°"
    web_server:
      sorting_weight: 241
    on_value:
      then:
        - script.execute: lamp_update
        - script.execute:
            id: group_send
            param: "LOC_LON"

  # LED brightness settable for when it is annoyingly in view
  - platform: template
    name: "_LED brightness"
    id: led_level
    entity_category: diagnostic
    disabled_by_default: true
    internal: true
    optimistic: true
    restore_value: true
    initial_value: 10
    min_value: 0
    max_value: 10
    step: 1
    mode: slider

text:
  # Short memorable unique user assigned name, potentially 
  # used for DNS/DHCP and advised as renamed friendly name in HA
  - platform: template
    name: "Device Label"
    id: device_label
    icon: "mdi:tag-text"
    mode: text
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 32
    web_server:
      sorting_weight: 110
    on_value:
      then:
        # Hostname-safe: letters, digits, inner dashes, capitals ignored.
        - lambda: |-
            std::string h;
            for (char c : x) {
              if (isalnum((unsigned char) c)) {
                h += c;
              } else if (!h.empty() && h.back() != '-') {
                h += '-';
              }
            }
            while (!h.empty() && h.back() == '-') h.pop_back();
            if (h != x) {
              id(device_label).make_call().set_value(h).perform();
              id(device_label).publish_state(h);   // force the clean text to the front end
            }


  # Name of the lamp group. Not broadcast: it selects the group. A new
  # name asks that group for its config.
  - platform: template
    name: "Device Group"
    id: device_group
    icon: mdi:lightbulb-group-outline
    mode: text
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "${default_group}"
    min_length: 0
    max_length: 32
    web_server:
      sorting_weight: 120
    on_value:
      then:
        - lambda: |-
            if (id(boot_done)) {
              id(group_is_synced) = false;
              id(group_has_peers) = false;
              id(sync_is_suspect) = false;
              id(req_fast) = true;
              id(peers).clear();
            }
        # Hostname-safe: letters, digits, inner dashes, capitals ignored.
        - lambda: |-
            std::string h;
            for (char c : x) {
              if (isalnum((unsigned char) c)) {
                h += c;
              } else if (!h.empty() && h.back() != '-') {
                h += '-';
              }
            }
            while (!h.empty() && h.back() == '-') h.pop_back();
            if (h != x) {
              id(device_group).make_call().set_value(h).perform();
              id(device_group).publish_state(h);
            }
        - script.execute: group_request

  # POSIX timezone string, see the header
  - platform: template
    name: "Location Timezone"
    id: tz_text
    icon: mdi:map-clock
    mode: text
    entity_category: config
    disabled_by_default: true
    optimistic: true
    restore_value: true
    initial_value: "${default_timezone}"
    min_length: 0
    max_length: 64
    web_server:
      sorting_weight: 242
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x.empty();'
            then:
              # Emptied by the user: put the compile defaults back, all three
              # so that a user messing about gets a plausible example what to put there
              - script.execute: reset_location
            else:
              # conditional, because update above spun up another parallel on_value
              - script.execute: lamp_update
              - script.execute:
                  id: group_send
                  param: "TZ_TEXT"


datetime:
  # Time points of the cycle.
  # With USE_SUN Morning window starts at schedule_on, evening window ends at schedule_off.
  # Without USE_SUN Night starts at schedule_on, night ends at schedule_off.
  - platform: template
    type: time
    name: "Schedule on"
    id: schedule_on
    icon: mdi:clock-outline
    entity_category: config
    disabled_by_default: true
    optimistic: true
    restore_value: true
    initial_value: "05:30:00"
    web_server:
      sorting_weight: 220
    on_value:
      then:
        - script.execute: lamp_update
        - script.execute:
            id: group_send
            param: "SCHEDULE_ON"
  - platform: template
    type: time
    name: "Schedule off"
    id: schedule_off
    icon: mdi:clock-outline
    entity_category: config
    disabled_by_default: true
    optimistic: true
    restore_value: true
    initial_value: "23:00:00"
    web_server:
      sorting_weight: 230
    on_value:
      then:
        - script.execute: lamp_update
        - script.execute:
            id: group_send
            param: "SCHEDULE_OFF"


script:
  # Decide what the cycle wants, and switch the lamp only when that changed.
  # Called on cycle enable, setting changes, time sync, boot and every
  # minute (so changed time points and the moving sun times are picked up).
  - id: lamp_update
    mode: restart
    then:
      - lambda: |-

          // unknown until proven otherwise:
          id(lamp_target) = -1;   // unknown until proven otherwise

          // If we are in the midle of a multi-step config change:
          // like a UDP receive skip this lamp_update:
          if (id(cfg_hold)) {
            return;
          }

          // If any of TimeZone, Lat or Lon is empty, use HA Runtime settings:
          // for clock and sun calculation:
          if (!id(tz_text).state.empty()) {
            id(ha_time).set_timezone(id(tz_text).state);
          }
          if (!std::isnan(id(loc_lat).state)) {
            id(sun_sun).set_latitude(id(loc_lat).state);
          }
          if (!std::isnan(id(loc_lon).state)) {
            id(sun_sun).set_longitude(id(loc_lon).state);
          }

          // Twilight level; Normal, Half Civil, Civil:
          static const double elevations[] = {-0.833, -3.0, -6.0};
          size_t lvl = id(twilight).active_index().value_or(0);
          if (lvl > 2) {
            lvl = 0;
          }


          auto time = id(ha_time).now();
          //ESP_LOGD("sun", "time=%s valid=%d TZ='%s' lat=%.1f lon=%.1f", t.strftime("%Y-%m-%d %H:%M:%S %z").c_str(),
          //  id(ha_time).now().is_valid(), id(tz_text).state.c_str(), id(loc_lat).state, id(loc_lon).state);

          bool sun = id(use_sun).state;
          bool scd = id(use_schedule).state;
          bool sns = id(sensor_act).state;   // SENSOR action
          bool mot = id(motion_act).state;   // MOTION action
          const double thr = elevations[lvl];
          char buf[48];

          // MOTION: on while the sun is below the level. Overrides the pause.
          // Works without a clock: a missing clock must not disable a safety light.
          if (mot && (!time.is_valid() || id(sun_sun).elevation() < thr)) {
            id(input_driven) = true;
            id(lamp_target) = 1;
            // The wall switch may have turned the lamp off behind the cycle's back,
            // so forget the applied state and the apply step sees a change:
            if (! id(lamp_output).remote_values.is_on()) id(lamp_applied) = 0;
            return;
          }

          // Neither sun nor schedule: only SENSOR, MOTION or the manual switch.
          // Needs no clock.
          if (!sun && !scd) {
            snprintf(buf, sizeof(buf), "Manual switch only");
            if (sns) {
              id(input_driven) = true;
              id(lamp_target) = 1;
            } else if (id(input_driven)) {
              id(input_driven) = false; // released: back to off
              id(lamp_target) = 0;
            } else {
              id(lamp_applied) = -1;     // forget, next one is a first state
            }
            id(lamp_info).publish_state(buf);
            return;
          }

          // No valid clock: the cycle does nothing, but SENSOR and MOTION still work.
          // Forget the applied state, so the next one counts as a first state and is not broadcast:
          if (! time.is_valid()) {
            id(lamp_info).publish_state("No valid clock, manual only");
            if (sns) {
              id(input_driven) = true;
              id(lamp_target) = 1;
            } else if (id(input_driven)) {
              id(input_driven) = false;  // released: back to off
              id(lamp_target) = 0;
            } else {
              id(lamp_applied) = -1;
            }
            return;
          }
          id(input_driven) = false;

          // Sun and/or Schedule active and a valid time: process the cycle
          int m   = time.hour * 60 + time.minute;
          int on  = id(schedule_on).hour  * 60 + id(schedule_on).minute;
          int off = id(schedule_off).hour * 60 + id(schedule_off).minute;

          // Is minute inside start..end? End itself is outside :
          // End before start crosses midnight. start == end is empty :
          auto in_window = [](int minute, int start, int end) -> bool {
            if (end < start) return minute >= start || minute < end; // crosses midnight
            if (end > start) return minute >= start && minute < end; // normal window
            return false; // so end==start; empty window
          };

          if (sun) {
            // Decision by elevation: continuous, no date rollover jump.
            // Wall_switch: when use_sensor this will widen light on period
            bool dark  = id(sun_sun).elevation() < thr || sns;
            bool pause = in_window(m, off, on);   // off..on, sun + times
            bool in_night_pause = scd && pause;
            id(lamp_target) = (dark && !in_night_pause) ? 1 : 0;


            // Info text only, never feeds the decision:
            auto up = id(sun_sun).sunrise(thr);
            auto dn = id(sun_sun).sunset(thr);
            if (up.has_value() && dn.has_value()) {
              snprintf(buf, sizeof(buf), "Next sun up %02d:%02d down %02d:%02d",
                       up->hour, up->minute, dn->hour, dn->minute);
              id(twilight_info).publish_state(buf);
              if (scd) {
                snprintf(buf, sizeof(buf), "%02d:%02d-%02d:%02d and %02d:%02d-%02d:%02d",
                         id(schedule_on).hour, id(schedule_on).minute,
                         up->hour, up->minute, dn->hour, dn->minute,
                         id(schedule_off).hour, id(schedule_off).minute);
              } else {
                snprintf(buf, sizeof(buf), "%02d:%02d-%02d:%02d",
                         dn->hour, dn->minute, up->hour, up->minute);
              }
            } else {
              id(twilight_info).publish_state("No sunrise/sunset today");
              if (scd) {
                snprintf(buf, sizeof(buf), "Follows sun, off %02d:%02d-%02d:%02d",
                         id(schedule_off).hour, id(schedule_off).minute,
                         id(schedule_on).hour, id(schedule_on).minute);
              } else {
                snprintf(buf, sizeof(buf), "Follows sun level");
              }
            }
            id(lamp_info).publish_state(buf);

          } else {
            if (scd) {
              // no Sun & Schedule: on from schedule_on to schedule_off, any length
              // Schedule only: the entire night, any length
              // Wall_switch: when SENSOR this will widen light on period
              bool in_schedule = in_window(m, on, off);
              id(lamp_target) = (in_schedule || sns) ? 1 : 0;
              snprintf(buf, sizeof(buf), "%02d:%02d-%02d:%02d",
                       id(schedule_on).hour, id(schedule_on).minute,
                       id(schedule_off).hour, id(schedule_off).minute);
              id(lamp_info).publish_state(buf);
            }
          }

      - if:
          condition:
            lambda: 'return id(lamp_target) >= 0 && id(lamp_target) != id(lamp_applied);'
          then:
            # The first apply after boot / enable is not broadcast. If the
            # group has another state, its answer to REQCONFIG wins.
            - lambda: |-
                bool tx_mute_saved_state = id(tx_mute);
                if (id(lamp_applied) < 0) id(tx_mute) = true;
                if (id(lamp_target) == 1) {
                  id(lamp_output).turn_on().perform();
                } else {
                  id(lamp_output).turn_off().perform();
                }
                id(lamp_applied) = id(lamp_target);
                id(tx_mute) = tx_mute_saved_state;


  # After a received USE_SUN / USE_SCHEDULE: let the rest of the series arrive,
  # then evaluate the cycle once, without broadcasting.
  - id: eval_quiet
    mode: restart
    then:
      - delay: 500ms
      - lambda: 'id(tx_mute) = true;'
      - script.execute: lamp_update
      - lambda: 'id(tx_mute) = false;'

  # NTP server = rotate through gateway + 0.pool through 3.pool
  # build in NTP server does not rotate, sticks to the first entry
  - id: net_setup
    mode: restart
    then:
      - lambda: |-
          bool time_is_stale = ! id(ha_time).now().is_valid() || (millis() - id(last_clock_sync_ms)) > 7200000;
          IPAddress gw = WiFi.gatewayIP();
          if (gw != IPAddress(0, 0, 0, 0) && time_is_stale) {
            static char ntp_buf[20];          // NTP server, static as must persist to NTP client
            static uint8_t step = 0;          // Cycle: gateway, 0.pool, 1.pool, 2.pool, 3.pool
            if (step == 0) {
              snprintf(ntp_buf, sizeof(ntp_buf), "%u.%u.%u.%u", gw[0], gw[1], gw[2], gw[3]);
            } else {
              snprintf(ntp_buf, sizeof(ntp_buf), "%u.pool.ntp.org", (unsigned) (step - 1));
            }
            step = (step + 1) % 5;
            configTime(0, 0, ntp_buf);
            ESP_LOGI("ntp", "NTP server: %s", ntp_buf);
            if (! id(tz_text).state.empty()) id(ha_time).set_timezone(id(tz_text).state);
          }
          

  # Send one parameter to the group. The value is made here from the
  # parameter name, which is the uppercase ID.
  - id: group_send
    mode: parallel # yes, we want parallel due to the delay below
    parameters:
      param: string
    then:
      - if:
          condition:
            lambda: 'return id(group_live) && !id(tx_mute) && !id(device_group).state.empty();'
          then:
            - delay: 1ms # allow for any ON_xxxx call to actually set .state
            - lambda: |-

                // Defining a value_of() internal lambda function     :
                // wrong idents to keep github change lines low       :
                // a later change may rename v to value and fix ident :
                auto value_of = [&](const std::string &param) -> std::string {
                std::string v;
                char b[24];

                if (param == "LAMP") {
                  // v = id(lamp_output).current_values.is_on() ? "1" : "0";
                  v = id(lamp_output).remote_values.is_on() ? "1" : "0";
                } else if (param == "USE_SCHEDULE") {
                  v = id(use_schedule).state ? "1" : "0";
                } else if (param == "USE_SUN") {
                  v = id(use_sun).state ? "1" : "0";
                } else if (param == "TWILIGHT") {
                  v = std::string(id(twilight).current_option());
                } else if (param == "LOC_LAT") {
                  snprintf(b, sizeof(b), "%.3f", id(loc_lat).state);
                  v = b;
                } else if (param == "LOC_LON") {
                  snprintf(b, sizeof(b), "%.3f", id(loc_lon).state);
                  v = b;
                } else if (param == "TZ_TEXT") {
                  v = id(tz_text).state;
                } else if (param == "SCHEDULE_ON") {
                  snprintf(b, sizeof(b), "%02d:%02d:%02d",
                           id(schedule_on).hour, id(schedule_on).minute, id(schedule_on).second);
                  v = b;
                } else if (param == "SCHEDULE_OFF") {
                  snprintf(b, sizeof(b), "%02d:%02d:%02d",
                           id(schedule_off).hour, id(schedule_off).minute, id(schedule_off).second);
                  v = b;
                } else if (param == "MOTION") {
                  v = id(motion_act).state ? "1" : "0";
                } else if (param == "SENSOR") {
                  v = id(sensor_act).state ? "1" : "0";
                }
                return v;
                };


                std::string pre = "LAMPGROUP:" + id(device_group).state + ":";
                std::string msg;
                if (param == "DUMP") {
                  // All 9 config parameters in one packet, COMPLETE; marks it as a full set :
                  static const char *names[] = {"LAMP", "TWILIGHT", "LOC_LAT", "LOC_LON", "TZ_TEXT",
                                                "SCHEDULE_ON", "SCHEDULE_OFF", "USE_SUN", "USE_SCHEDULE"};
                  for (int i = 0; i < 9; i++) {
                    msg += names[i];
                    msg += ":";
                    msg += value_of(names[i]);
                    msg += ";";
                  }
                  msg += id(sync_is_suspect) ? "SUSPECT;" : "COMPLETE;";
                } else {
                  msg = param + ":" + value_of(param) + ";";

                  // Only the latest value of a parameter matters: replace a queued single item
                  std::string key = pre + param + ":";
                  for (auto &q : id(udp_queue)) {
                    if (q.compare(0, key.size(), key) == 0 && q.find(';') == q.size() - 1) {
                      q = pre + msg;
                      return;
                    }
                  }
                }
                if (id(udp_queue).size() < 24) {
                  id(udp_queue).push_back(pre + msg);
                }

            - if:
                condition:
                  not:
                    script.is_running: group_flush
                then:
                  - script.execute: group_flush


  # Ask the group for its config. Immediate on user change or with never valid config.
  # With staggered long delay on reboots with prior valid config to avoid network storm
  # after a full power outage. This also  allows the network to come up first
  - id: group_request
    mode: restart
    then:
      - lambda: 'id(group_live) = true;'
      - if:
          condition:
            lambda: 'return id(group_is_synced) && ! id(sync_is_suspect) && ! id(device_group).state.empty();'
          then:
            - delay: !lambda 'return (uint32_t) (2000 + random_uint32() % 5000);'
            - script.execute:
                id: udp_tx
                msg: !lambda 'return "LAMPGROUP:" + id(device_group).state + ":HELLO;";'
      - delay: !lambda |-
          if (id(req_fast)) {
            // User did a group change: network is up, ask immediate, as a REQCONFIG
            id(req_fast) = false;
            id(send_reqconfig) = true; // operator action! we want fast response
            return (uint32_t) 500;     // Tiny wait for double group on_value call
          }
          if (!id(group_is_synced) || id(sync_is_suspect)) {
            // Never synced (new device or new group): ask soon, as a REQCONFIG
            // or a former or real lone device : ask soon, as a REQCONFIG
            id(send_reqconfig) = true; // operator action? we want fast response
            return (uint32_t) 5000;    // Allow 5 seconds for DHCP to finish
          }
          // Boot / reconnect, could be caused by side wide power failure :
          // so we stagger config requests between 20 to 30 minutes :
          id(send_reqconfig) = false;  // No operator action? large wait, slow response
          return (uint32_t) (1200000 + random_uint32() % 600000);
      - lambda: 'id(last_req_ms) = millis();'
      - if:
          condition:
            lambda: 'return !id(device_group).state.empty();'
          then:
            - script.execute:
                id: udp_tx
                msg: !lambda 'return "LAMPGROUP:" + id(device_group).state + (id(send_reqconfig) ? ":REQCONFIG;" : ":RECONNECT;");'
      - delay: 10s
      # Nothing from our group arrived: we are alone, so we assume we are synced.
      - if:
          condition:
            lambda: 'return !id(group_has_peers);'
          then:
            - lambda: 'id(group_is_synced) = true;'
            - lambda: 'id(sync_is_suspect) = true;'
      # No full set yet: so we keep asking in a while loop
      # note the while is infinite, but the UDP receive simply cancels this script to end
      - while:
          condition:
            lambda: 'return !id(device_group).state.empty();'
          then:
            - delay: 5min
            # grab timestamp to ignore echo's
            - lambda: |-
                id(send_reqconfig) = true;
                id(last_req_ms) = millis();
            - script.execute:
                id: udp_tx
                msg: !lambda 'return "LAMPGROUP:" + id(device_group).state + ":REQCONFIG;";'


  # Answer a REQCONFIG or RECONNECT send everything as s single packet
  - id: group_dump
    mode: restart
    then:
      # Suspect lamps answers slightly slower then lamps in good standing
      - delay: !lambda 'return (uint32_t) (random_uint32() % 500 + (id(sync_is_suspect) ? 2000 : 0));'
      - script.execute:
          id: group_send
          param: "DUMP"


  # Send one packet twice: adds the PEER item, logs the exact wire text.
  # Queued, so two callers cannot interleave their copies.
  - id: udp_tx
    mode: queued
    parameters:
      msg: string
    then:
      - lambda: |-
          id(tx_buf) = msg + "PEER:" + std::string(WiFi.localIP().toString().c_str()) + "," +
                       id(device_label).state + "," + get_mac_address_pretty() + ";";
          ESP_LOGD("udp", "out: %s", id(tx_buf).c_str());
      - udp.write:
          id: lamp_udp
          data: !lambda 'return std::vector<uint8_t>(id(tx_buf).begin(), id(tx_buf).end());'
      # sending it twice to counter lossy UDP
      - delay: ${udp_retry}
      - udp.write:
          id: lamp_udp
          data: !lambda 'return std::vector<uint8_t>(id(tx_buf).begin(), id(tx_buf).end());'


  # Send the queued packets one by one, 20 ms apart, so a burst of changes
  # does not exhaust the network buffers.
  - id: group_flush
    mode: single
    then:
      - while:
          condition:
            lambda: 'return !id(udp_queue).empty();'
          then:
            - script.execute:
                id: udp_tx
                msg: !lambda 'return id(udp_queue).front();'
            - script.wait: udp_tx
            - lambda: 'id(udp_queue).erase(id(udp_queue).begin());'
            - delay: 20ms


  # Daily WiFi refresh at 13:00, while the air is busy and the lamps are likely dormant
  # Random wait of 0-5 min spreads the lamps to avoid network storm
  - id: wifi_cycle
    mode: single
    then:
      - delay: !lambda 'return random_uint32() % 300000;'
      - wifi.disable:
      - delay: 10s
      - wifi.enable:


  # Blanking out TZ will put back compile defaults for TZ and location
  # Not only for my own easy, but also it gives the user an example TZ
  - id: reset_location
    mode: restart
    then:
      - delay: 1s
      - lambda: |-
          id(loc_lat).make_call().set_value(${default_latitude}).perform();
          id(loc_lon).make_call().set_value(${default_longitude}).perform();
          id(tz_text).make_call().set_value("${default_timezone}").perform();

#  # Hostname from the label, applied after ESPHome's own apply at connect.

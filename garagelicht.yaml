#######################################################################################
# Garage Licht Controller
#
# This is a derived partner device to the outdoor-lamp project
# it serves as a one-off for me, but should others use this, it is an example.
#
# Switch 1 + Relay 1 normal outdoor-lamp group broadcast and config
# In my setup, it will have the pre-existing ambient daylight sensor connected
#
# Switch 2 + Relay 2 Garage light and the spring loaded push switch (pushbutton) 
# also with power measurement, and auto switch off after 4 hours 
# I put them in one device because a) I had an unused Shelly2.5 and b) they were 
# already in the same wall box.
#
#######################################################################################

packages:
  outdoor-lamp: !include outdoor-lamp.yaml
  diagnostics: !include common/diagnostics.yaml
  # Pick one board. Pins, inversion and the platform block live there.
  board: !include common/board-shelly2.5-classic-2m.yaml

substitutions:
# Substitutions like hardware pins from common/board-.....yaml added from packages
  devicename: garagelicht
  description: "Garage Licht Controller"
  prj_version: "2026.11.06"
  channel_1: Lamp
  channel_2: Garage
  max_power: "400.0"

esphome:
  name_add_mac_suffix: false # one off device

web_server:
  sorting_groups:
    - id: sorting_group_garage
      name: "Garage"
      sorting_weight: -10    # On top of the screen

#######################################################################################

# I2C for the current sensor chip
i2c:
  sda: GPIO12
  scl: GPIO14

sensor:
  - platform: ade7953_i2c
    irq_pin: GPIO16 # Prevent overheating by setting this
    # On the Shelly 2.5 channels are mixed ch1=B ch2=A
    current_a:
      name: ${channel_2} current
      internal: true
      disabled_by_default: true
      icon: mdi:flash
      filters:
        - lambda: return round(x * 100.0f) / 100.0f;
        - offset: -0.02 
      web_server:
        sorting_weight: 110
        sorting_group_id: sorting_group_garage
    current_b:
      name: ${channel_1} current
      internal: true
      disabled_by_default: true
      icon: mdi:flash
      filters:
        - lambda: return round(x * 100.0f) / 100.0f;
        - offset: -0.02 
    active_power_a:
      name: ${channel_2} power
      id: power_channel_2
      icon: mdi:flash
      disabled_by_default: true
      filters:
        - lambda: return round(x * 2.0f) / 2.0f;
      web_server:
        sorting_weight: 130
        sorting_group_id: sorting_group_garage
      on_value_range:
        - above: ${max_power}
          then:
            - light.turn_off: garage_lamp_output
            - homeassistant.service:
                service: persistent_notification.create
                data:
                  title: Message from ${devicename}
                data_template:
                  message: Switch turned off because power exceeded ${max_power}W
    active_power_b:
      name: ${channel_1} power
      id: power_channel_1
      icon: mdi:flash
      disabled_by_default: true
      filters:
        # active_power_b is inverted, so take the value * -1
        # this not the case for active_power_a
        - lambda: return -x;
        - lambda: return round(x * 2.0f) / 2.0f;
      on_value_range:
        - above: ${max_power}
          then:
            - light.turn_off: lamp_output
            - homeassistant.service:
                service: persistent_notification.create
                data:
                  title: Message from ${devicename}
                data_template:
                  message: Switch turned off because power exceeded ${max_power}W
    update_interval: 30s


# Both energy values are not stored. Instead they are given "ever increasing" 
# in HA so a reset to 0 is handled there. Hence the name "daily" energy.
  - platform: total_daily_energy
    name: ${channel_1} energy
    power_id: power_channel_1
    filters:
      # Multiplication factor from W to kWh is 0.001
      - multiply: 0.001
#      - round_to_multiple_of: 0.001
#      - delta: 0.001
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    icon: mdi:lightning-bolt
    restore: false

  - platform: total_daily_energy
    name: ${channel_2} energy
    power_id: power_channel_2
    filters:
      # Multiplication factor from W to kWh is 0.001
      - multiply: 0.001
#      - round_to_multiple_of: 0.001
#      - delta: 0.001
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    icon: mdi:lightning-bolt
    restore: false
    web_server:
      sorting_weight: 120
      sorting_group_id: sorting_group_garage


# The simple relay/switch/light combo for the extra garage lamp
output:
  - platform: gpio
    pin: ${GPIO_relay2}
    id: garage_relay_output


light:
  - platform: binary
    name: "Garage lamp"
    output: garage_relay_output
    id: garage_lamp_output
    icon: mdi:lightbulb-outline
    on_turn_on:
      - lambda: 'id(garage_long).publish_state(false);'
      - script.execute: garage_autooff
    on_turn_off:
      - lambda: 'id(garage_long).publish_state(false);'
    web_server:
      sorting_weight: 100
      sorting_group_id: sorting_group_garage

binary_sensor:
  - platform: gpio
    pin:
      number: ${GPIO_wall2}
      mode:
        input: true
        pullup: ${wall_pullup}
      inverted: ${wall_inverted}
    name: "${channel_2} switch"
    icon: mdi:electric-switch
    id: garage_wall_switch
    internal: true
    disabled_by_default: true
    filters:
      - delayed_on: ${on_debounce}
      - delayed_off: 50ms
    web_server:
      sorting_weight: 190
      sorting_group_id: sorting_group_garage
    # it has a pushbutton style switch
    on_click:
      # short press: toggle on release
      - min_length: 50ms
        max_length: 800ms
        then:
          - light.toggle: garage_lamp_output
      # long press: on, 4 h mode
      - min_length: 800ms
        max_length: 10s
        then:
          - light.turn_on: garage_lamp_output
          - lambda: 'id(garage_long).publish_state(true);'
          - script.execute: garage_autooff

  # long timeout indicator
  - platform: template
    name: "${channel_2} long timeout"
    id: garage_long
    icon: mdi:timer-lock-outline
    internal: true
    web_server:
      sorting_weight: 195
      sorting_group_id: sorting_group_garage
      
switch:
  # Presence: HA/REST/web keepalive. Each turn_on call restarts the garage timer.
  - platform: template
    name: "${channel_2} presence"
    id: garage_presence
    icon: mdi:account-check
    optimistic: true
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_weight: 140
      sorting_group_id: sorting_group_garage
    turn_on_action:
      - if:
          condition:
            light.is_on: garage_lamp_output
          then:
            - script.execute: garage_autooff
      - script.execute: garage_presence_expire
    on_turn_off:
      - script.stop: garage_presence_expire


script:
  # Garage light turns off after 10 minutes or 2 hours
  - id: garage_autooff
    mode: restart
    then:
      - delay: !lambda 'return id(garage_long).state ? 14400000 : 600000;'
      - light.turn_off: garage_lamp_output

  # Presence drops after 10 min without a keepalive
  - id: garage_presence_expire
    mode: restart
    then:
      - delay: 601 seconds
      - switch.turn_off: garage_presence

      
interval:
  # While MOTION is active and the garage lamp is on, keep restarting the 4h timer
  - interval: 10s
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(motion_act).state;'
              - light.is_on: garage_lamp_output
          then:
            - script.execute: garage_autooff

# Diagnostics shared by projects: uptime, WiFi signal, restart button.

button:

  - platform: restart
    name: "_Restart"
    disabled_by_default: true
    entity_category: diagnostic

  - platform: factory_reset
    name: "_Restart Factory Default"
    disabled_by_default: true
    entity_category: diagnostic

sensor:

  - platform: uptime
    name: "_Uptime"
    disabled_by_default: true
    entity_category: diagnostic

  - platform: wifi_signal
    name: "_Wi-Fi Signal"
    update_interval: 60s
    disabled_by_default: true
    entity_category: diagnostic

text_sensor:

  - platform: wifi_info
    ip_address:
      name: "_IP Address"
      disabled_by_default: true
    ssid:
      name: "_Wi-Fi SSID"
      disabled_by_default: true
    bssid:
      name: "_Wi-Fi BSSID"
      disabled_by_default: true

  - platform: version
    name: "_ESPHome Version"
    hide_timestamp: true
    disabled_by_default: true
    entity_category: diagnostic
